<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="380" fill="#1e1e2e" rx="8"/>
<rect width="800" height="30" fill="#181825" rx="8"><animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/></rect>
<circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" opacity="0">dhcp_pool_check.py + roam_quality.py<animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">$ python3 scripts/dhcp_pool_check.py /var/log/dhcp.log<animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="85" fill="#89b4fa" font-family="monospace" font-size="14" opacity="0">Pool: 10.0.1.50-10.0.1.250 (201 addresses)<animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="110" fill="#cdd6f4" font-family="monospace" font-size="14" opacity="0">Unique IPs issued: 199 | Utilization: 99.0%<animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="140" fill="#f38ba8" font-family="monospace" font-size="15" font-weight="bold" opacity="0">🔴 ALERT: POOL EXHAUSTED!<animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="2.2s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="175" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">$ python3 scripts/roam_quality.py /var/log/wifi.log<animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="205" fill="#cdd6f4" font-family="monospace" font-size="14" opacity="0">Total roams: 6696<animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="230" fill="#f38ba8" font-family="monospace" font-size="14" opacity="0">Bad roams (both&lt;-75dBm): 583 (8.7%)<animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="3.7s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="260" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">🔴 CRITICAL: sticky clients confirmed<animate attributeName="opacity" values="0;1" begin="3.8s" dur="0.4s" fill="freeze"/><animate attributeName="opacity" values="1;0.6;1" begin="4.2s" dur="1.5s" repeatCount="indefinite"/></text>
<text x="15" y="290" fill="#89b4fa" font-family="monospace" font-size="13" opacity="0">Recommendation: enable min RSSI kick at -75dBm<animate attributeName="opacity" values="0;1" begin="4.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="320" fill="#89b4fa" font-family="monospace" font-size="13" opacity="0">              expand DHCP pool ×2<animate attributeName="opacity" values="0;1" begin="4.8s" dur="0.4s" fill="freeze"/></text>
<rect x="140" y="307" width="10" height="16" fill="#a6e3a1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="5.2s" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="5.4s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
